<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="data:,"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vibe Code Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#070d1a;--panel:#0f1a2e;--panel2:#132239;--line:#22324f;--line2:#33496f;--text:#d8e6ff;--muted:#8ea3c7;
    --cyan:#5fd0ff;--violet:#c28aff;--mint:#5fe3b8;--amber:#ffb35c;--red:#ff5a6e;--yellow:#ffd84d}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 600px at 30% 0%,#13244a 0%,var(--bg) 60%);color:var(--text);
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  .pix{font-family:'Silkscreen',ui-monospace,monospace}
  .box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);
    box-shadow:0 0 0 2px #050a14,inset 0 0 0 1px rgba(95,208,255,.06);border-radius:4px}
  #app{display:grid;height:100vh;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr auto;gap:10px;padding:10px}
  /* header */
  #hdr{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto;gap:10px}
  #logo{display:flex;align-items:center;gap:12px;padding:8px 14px}
  #logo .mark{width:38px;height:38px;background:conic-gradient(from 45deg,var(--violet),var(--cyan),var(--mint),var(--violet));
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:0 0 18px rgba(95,208,255,.5)}
  #logo .t{font-family:'Press Start 2P',monospace;font-size:20px;letter-spacing:1px;color:#fff;text-shadow:3px 3px 0 #1b2a55,0 0 14px rgba(95,208,255,.35)}
  #logo .t b{color:var(--cyan)}
  #logo .s{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:6px}
  #stats{display:flex;align-items:stretch}
  .stat{padding:8px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:86px}
  .stat:last-child{border-right:none}
  .stat .k{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}
  .stat .v{font-size:18px;font-weight:800;color:#fff;margin-top:2px}
  .stat.proj .v{font-size:14px}
  .bar{height:5px;background:#0b1322;border:1px solid var(--line2);margin-top:5px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .4s}
  .v.todo{color:var(--yellow)}.v.run{color:var(--cyan)}.v.rev{color:var(--violet)}.v.done{color:var(--mint)}
  #phase{color:var(--mint)}
  #live{display:flex;flex-direction:column;justify-content:center;padding:8px 16px;min-width:130px}
  #live .l{font-family:'Silkscreen',monospace;font-size:18px;color:var(--mint);display:flex;align-items:center;gap:8px}
  #live .l i{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);animation:blink 1.6s infinite}
  #live.off .l{color:var(--amber)}#live.off .l i{background:var(--amber);box-shadow:0 0 10px var(--amber)}
  #live .c{color:var(--muted);margin-top:4px}
  @keyframes blink{50%{opacity:.35}}
  /* scene */
  #stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden}
  #world{position:relative;height:100%;width:100%;display:flex;align-items:center;justify-content:center}
  #world canvas{display:block;max-width:100%;max-height:100%;width:auto!important;height:auto!important;image-rendering:pixelated;border-radius:2px}
  #fs{position:absolute;top:10px;right:10px;z-index:25;display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;
    background:rgba(15,26,46,.85);color:var(--text);border:2px solid var(--line2);border-radius:4px;font:11px 'Silkscreen',monospace;letter-spacing:1px}
  #fs:hover{border-color:var(--cyan);color:#fff;box-shadow:0 0 10px rgba(95,208,255,.35)}
  #fs svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
  #stage:fullscreen{background:var(--bg);border:none;border-radius:0;padding:0}
  /* sidebar */
  #side{grid-row:2/4;grid-column:2;display:flex;flex-direction:column;gap:10px;min-height:0}
  .sec{padding:10px 12px;min-height:0;display:flex;flex-direction:column}
  .sec h3{margin:0 0 8px;font-family:'Silkscreen',monospace;font-size:15px;letter-spacing:1px;color:#fff;font-weight:700}
  .sec h3 small{font-size:12px;color:var(--cyan);font-weight:400}
  #board{flex:0 0 auto}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .col .ch{text-align:center;font-family:'Silkscreen',monospace;font-size:12px;padding:4px;border-radius:3px;color:#fff;margin-bottom:5px}
  .col.todo .ch{background:#8a5a1d}.col.rev .ch{background:#6a3fc2}.col.done .ch{background:#147a5f}
  .col .list{display:flex;flex-direction:column;gap:4px;max-height:168px;overflow:auto;padding-right:2px}
  .card{background:#0b1322;border:1px solid var(--line);border-left:3px solid var(--line2);padding:4px 6px;border-radius:3px;font-size:10.5px}
  .card .id{color:var(--muted);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .tt{color:#fff}
  .card.run{border-left-color:var(--cyan)}.card.block{border-left-color:var(--red)}.card.rev{border-left-color:var(--violet)}.card.done{border-left-color:var(--mint)}
  .card .tag{display:inline-block;font-size:9px;padding:0 4px;border-radius:2px;margin-top:2px}
  .card.run .tag{background:#0d3a52;color:var(--cyan)}.card.block .tag{background:#4a1520;color:var(--red)}
  .more{color:var(--mint);font-size:10.5px;padding:2px 4px}
  #agents{flex:1 1 0}#idle{flex:1 1 0}
  .rows{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:3px}
  .row{display:grid;grid-template-columns:10px 30px 70px 74px 1fr auto;gap:6px;align-items:center;padding:4px 6px;border-radius:3px;cursor:pointer}
  .row:hover{background:#16243d}
  .row .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 6px var(--mint)}
  .row.idle .dot{background:var(--amber);box-shadow:0 0 6px var(--amber)}
  .av{width:28px;height:28px;border:1px solid var(--line2);border-radius:3px;background:#0b1322 no-repeat 50% 14%/150% auto}
  .row .nm{color:#fff;font-weight:800}
  .role{font-size:10px;padding:1px 5px;border-radius:2px;color:#06121f;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .what{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .tm{color:var(--muted);font-size:10.5px}
  .empty{color:var(--muted);padding:6px}
  /* roster */
  #roster{grid-column:1;display:grid;grid-template-columns:6fr 4fr 5fr;gap:10px;padding:10px 12px}
  #roster h3{margin:0 0 6px}
  .grp{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:rgba(11,19,34,.6)}
  .grp h4{margin:0 0 6px;font-family:'Silkscreen',monospace;font-size:13px;font-weight:700}
  .grp.b h4{color:var(--cyan)}.grp.r h4{color:var(--violet)}.grp.s h4{color:var(--mint)}
  .chars{display:flex;gap:6px;flex-wrap:wrap}
  .ch{width:58px;cursor:pointer;text-align:center}
  .ch .pic{position:relative;width:58px;height:54px;border:2px solid var(--line2);border-radius:4px;background:#0b1322 no-repeat 50% 13%/135% auto;transition:transform .12s,border-color .12s}
  .ch:hover .pic{transform:translateY(-2px);border-color:var(--cc)}
  .ch .pic i{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}
  .ch.work .pic i{background:var(--mint);box-shadow:0 0 6px var(--mint)}
  .ch .n{margin-top:2px;font-size:10.5px;color:#fff}
  /* narrow / short windows: stack everything and scroll the page, the scene keeps a real height */
  @media (max-width:1100px),(max-height:640px){
    body{overflow:auto}
    #app{height:auto;grid-template-columns:1fr;grid-template-rows:none}
    #hdr{grid-column:1;grid-template-columns:1fr}
    #stats{flex-wrap:wrap}.stat{border-bottom:1px solid var(--line)}
    #stage{grid-column:1;height:min(72vw,82vh);min-height:260px}
    #side{grid-row:auto;grid-column:1}
    #agents,#idle{max-height:340px}
    #roster{grid-column:1;grid-template-columns:1fr}
  }
  #stage:fullscreen{height:100vh}
  #stage.max{position:fixed;inset:0;z-index:40;height:100vh;min-height:0;border:none;border-radius:0;background:var(--bg);padding:0}
  /* scene helpers hidden (test controls) */
  #hidden{display:none}
  #loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .5s}
  #loading.done{opacity:0;pointer-events:none}
  #loading .title{font-family:'Press Start 2P',monospace;font-size:16px;letter-spacing:2px;color:var(--cyan)}
  #loading .dots span{display:inline-block;width:10px;height:10px;margin:0 4px;background:#c28aff;animation:hop .9s infinite}
  #loading .dots span:nth-child(2){background:#5fe3b8;animation-delay:.15s}
  #loading .dots span:nth-child(3){background:#ffb35c;animation-delay:.3s}
  #loading .dots span:nth-child(4){background:#ff8fb3;animation-delay:.45s}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  #loading .track{width:min(320px,70vw);height:14px;border:2px solid #33496f;background:#16223a;padding:2px}
  #loading-bar{width:0;height:100%;background:linear-gradient(90deg,#5fd0ff,#c28aff);transition:width .2s}
  #loading small{color:var(--muted)}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a3b5c;border-radius:3px}
</style>
</head>
<body data-studio>
<div id="loading">
  <div class="title">VIBE CODE STUDIO</div>
  <div class="dots"><span></span><span></span><span></span><span></span></div>
  <div class="track"><div id="loading-bar"></div></div>
  <small>Đang mở văn phòng… <b id="loading-text">0%</b></small>
</div>
<div id="app">
  <header id="hdr">
    <div id="logo" class="box"><div class="mark"></div><div><div class="t">VIBE <b>CODE</b> STUDIO</div><div class="s">AI AGENTS · BUILD FASTER TOGETHER</div></div></div>
    <div id="stats" class="box">
      <div class="stat proj"><span class="k">Project</span><span class="v" id="s-proj">—</span></div>
      <div class="stat"><span class="k">Layer</span><span class="v" id="s-layer">—</span><div class="bar"><i id="s-layerbar" style="width:0"></i></div></div>
      <div class="stat"><span class="k">Phase</span><span class="v" id="phase">—</span></div>
      <div class="stat"><span class="k">Total tasks</span><span class="v" id="s-total">0</span></div>
      <div class="stat"><span class="k">Todo</span><span class="v todo" id="s-todo">0</span></div>
      <div class="stat"><span class="k">Running</span><span class="v run" id="s-run">0</span></div>
      <div class="stat"><span class="k">Review</span><span class="v rev" id="s-rev">0</span></div>
      <div class="stat"><span class="k">Done</span><span class="v done" id="s-done">0</span></div>
    </div>
    <div id="live" class="box"><div class="l"><i></i><span id="live-t">LIVE</span></div><div class="c" id="clock">--:--:--</div></div>
  </header>
  <main id="stage" class="box"><div id="world"></div>
    <button id="fs" title="Toàn màn hình (F)"><svg viewBox="0 0 16 16"><path id="fs-ico" d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/></svg><span id="fs-t">FULLSCREEN</span></button></main>
  <aside id="side">
    <section id="board" class="sec box"><h3>TASK BOARD</h3>
      <div class="cols">
        <div class="col todo"><div class="ch" id="c-todo">TODO (0)</div><div class="list" id="l-todo"></div></div>
        <div class="col rev"><div class="ch" id="c-rev">REVIEW (0)</div><div class="list" id="l-rev"></div></div>
        <div class="col done"><div class="ch" id="c-done">DONE (0)</div><div class="list" id="l-done"></div></div>
      </div>
    </section>
    <section id="agents" class="sec box"><h3>AGENTS <small id="a-count">(WORKING 0 / 15)</small></h3><div class="rows" id="a-rows"></div></section>
    <section id="idle" class="sec box"><h3>IDLE AGENTS <small id="i-count">(0)</small></h3><div class="rows" id="i-rows"></div></section>
  </aside>
  <footer id="roster" class="box"></footer>
</div>
<div id="hidden"><div id="force"></div><div id="force-review"></div><div id="force-idle"></div><div id="log"></div></div>
<script type="module" src="/src/coding-test.ts"></script>
<script type="module" src="/src/dashboard.ts"></script>
</body>
</html>
